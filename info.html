<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Token Address</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 6s ease-in-out infinite;
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.5;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }

    header {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    main {
      max-width: 700px;
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .token-box {
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 1.5rem 1.25rem;
      margin: 1.5rem auto 0;
      max-width: 520px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      text-align: left;
    }

    .token-box h2 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
      text-align: center;
    }

    .token-label {
      font-size: 0.95rem;
      color: #cfd6ff;
      margin-bottom: 0.4rem;
      text-align: center;
    }

    .token-address {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 0.95rem;
      color: #eaf0ff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 0.6rem 0.7rem;
      word-break: break-all;
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.25);
    }

    footer {
      margin-top: auto;
      padding: 1rem;
      font-size: 0.85rem;
      color: #cfd6ff;
      text-align: center;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Token Address</h1>
  </header>

  <main>
    <div class="token-box">
      <h2>Welcome to join our dream</h2>
      <div class="token-label">Just copy paste and do your way to our way</div>
      <div class="token-address" id="tokenAddress">
        ....
      </div>
      <button id="copyButton" type="button">
        Copy address
      </button>

    </div>

    <p>
      Pay attention to every movement to not lose our associated movement!
    </p>
  </main>

  <footer>
    Let the journey begin today with your funds
  </footer>
  <script src="token.js"></script>
</body>
</html>
