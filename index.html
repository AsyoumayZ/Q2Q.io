<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quantity 2 Qaulity</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    /* Base / layout */
    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      color: #f0f4ff; /* bright text */
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;

      /* Dark night sky background */
      background: radial-gradient(ellipse at bottom, #0b1026 0%, #020205 100%);
      position: relative;
      overflow-x: hidden;
    }

    /* Stars layer */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      /* Many small white dots as stars */
      background-image:
        radial-gradient(1px 1px at 10% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 20% 30%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 35% 60%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 50% 20%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 65% 40%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 80% 10%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 90% 70%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 15% 80%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 45% 90%, #fff, rgba(255,255,255,0)),
        radial-gradient(1px 1px at 75% 85%, #fff, rgba(255,255,255,0));
      background-size: 200px 200px;
      background-repeat: repeat;
      opacity: 0.7;

      animation: twinkle 6s ease-in-out infinite;
    }

    /* Slightly larger / brighter stars */
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1.5px 1.5px at 25% 25%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 55% 35%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 85% 55%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 35% 75%, #fff, rgba(255,255,255,0)),
        radial-gradient(1.5px 1.5px at 65% 15%, #fff, rgba(255,255,255,0));
      background-size: 300px 300px;
      background-repeat: repeat;
      opacity: 0.5;

      animation: twinkle 8s ease-in-out infinite reverse;
    }

    /* Twinkle animation */
    @keyframes twinkle {
      0%, 100% {
        opacity: 0.45;
        filter: brightness(0.9);
      }
      50% {
        opacity: 0.8;
        filter: brightness(1.2);
      }
    }

    header {
      width: 100%;
      background: rgba(0, 0, 0, 0.55);
      color: #ffffff;
      text-align: center;
      padding: 2rem 1rem;
      position: relative;
      z-index: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.6);
    }

    main {
      max-width: 900px;
      width: 100%;
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.6);
      margin-top: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-top: 1.5rem;
      color: #eaf0ff; /* bright, slightly blueish white */
      text-shadow: 0 0 6px rgba(255, 255, 255, 0.35);
    }

    footer {
      margin-top: auto;
      padding: 1rem;
      font-size: 0.85rem;
      color: #cfd6ff; /* bright gray-blue */
      text-align: center;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <header>
    <h1>Quantity 2 Qaulity</h1>
  </header>

  <main>
    <!-- The Garden of Eden by Thomas Cole (1828) -->
    <img
      src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Thomas_Cole_-_The_Garden_of_Eden_%281828%29.jpg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original"
      alt="The Garden of Eden by Thomas Cole (1828)"
    >
    <p>
      Back to where we came from to our original
    </p>
  </main>

  <footer>
    Let the journy begin today with your fund
  </footer>
</body>
</html>
